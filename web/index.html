<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7"><meta name="description" content="AltSource Center">
<title>AltSource Center</title><link rel="stylesheet" href="css/app.css"></head>
<body>
<header class="topbar"><div><div class="brand">AltSource <span>Center</span></div><div class="subtitle" data-i18n="tagline"></div></div><button id="themeButton" class="icon-button">◐</button></header>
<main>
<section id="tab-home" class="tab-panel"><div class="hero-card"><div class="hero-icon">A</div><div><h1 data-i18n="welcome"></h1><p data-i18n="welcomeText"></p></div></div><div class="quick-actions"><button class="primary" data-action="add-source" data-i18n="addSource"></button><button class="secondary" data-action="get-software" data-i18n="getSoftware"></button></div><h2 data-i18n="recentSources"></h2><div id="recentSources" class="card-list"></div><div id="homeEmpty" class="empty" data-i18n="homeEmpty"></div></section>
<section id="tab-sources" class="tab-panel hidden"><div class="section-head"><div><h2 data-i18n="sources"></h2><p data-i18n="sourcesText"></p></div><button class="primary small" data-action="add-source" data-i18n="addSource"></button></div><div id="sourcesList" class="card-list"></div><div id="sourcesEmpty" class="empty" data-i18n="noSources"></div></section>
<section id="tab-apps" class="tab-panel hidden"><div class="section-head"><div><h2 data-i18n="apps"></h2><p data-i18n="appsText"></p></div><input id="appSearch" class="search" type="search" data-i18n-placeholder="searchApps"></div><div id="appsList" class="app-grid"></div><div id="appsEmpty" class="empty" data-i18n="noApps"></div></section>
<section id="tab-clients" class="tab-panel hidden"><div class="section-head"><div><h2 data-i18n="clients"></h2><p data-i18n="clientsText"></p></div></div><div id="clientsList" class="client-grid"></div></section>
<section id="tab-settings" class="tab-panel hidden"><div class="section-head"><div><h2 data-i18n="settings"></h2><p data-i18n="settingsText"></p></div></div><div class="settings-card"><label><span data-i18n="language"></span><select id="languageSelect"><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select></label><button class="secondary" id="exportButton" data-i18n="export"></button><button class="secondary" id="importButton" data-i18n="import"></button><input id="importFile" type="file" accept="application/json" hidden><button class="danger" id="clearButton" data-i18n="clear"></button></div><div class="notice" data-i18n="privacy"></div></section>
</main>
<nav class="tabbar"><button class="tab active" data-tab="home">⌂<span data-i18n="home">Home</span></button><button class="tab" data-tab="sources">▣<span data-i18n="sources">Sources</span></button><button class="tab" data-tab="apps">◇<span data-i18n="apps">Apps</span></button><button class="tab" data-tab="clients">↗<span data-i18n="clients">Clients</span></button><button class="tab" data-tab="settings">⚙<span data-i18n="settings">Settings</span></button></nav>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div>
<script src="js/i18n.js"></script><script src="js/app.js"></script></body></html>
