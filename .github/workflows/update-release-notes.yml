name: Update Release Notes

on:
  workflow_run:
    workflows: ["Build iOS IPAs (manual)"]
    types: [completed]

permissions:
  contents: write

jobs:
  notes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update source and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          TAG="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          VERSION="${TAG#v}"
          ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].url' 2>/dev/null || true)"
          SOURCE_URL="https://xiaozhang-qd.github.io/AltSource-Center/source.json"
          IPA="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[0].browser_download_url' 2>/dev/null || true)"
          IPA_SIZE="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[0].size')"
          IPA_DATE="$(gh release view "$TAG" --repo "$REPO" --json publishedAt --jq '.publishedAt')"
          jq --arg version "$VERSION" --arg date "$IPA_DATE" --arg url "$IPA" --argjson size "$IPA_SIZE" '
            .apps[0].versions = ([{
              version:$version,
              buildVersion:"2",
              date:$date,
              localizedDescription:("AltSource Center " + $version + "."),
              downloadURL:$url,
              size:$size,
              minOSVersion:"13.0"
            }] + .apps[0].versions)
            | .apps[0].versions |= unique_by(.version)
          ' web/source.json > web/source.json.tmp
          mv web/source.json.tmp web/source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/source.json
          git diff --cached --quiet || git commit -m "Update AltSource source for $TAG"
          git push
          {
            echo "## AltSource Center $TAG"
            echo
            echo "### Add this source"
            echo "- altstore://source?url=$SOURCE_URL"
            echo
            echo "### Add source"
            echo "- AltStore Classic: altstore-classic://source?url=$SOURCE_URL"
            echo "- SideStore: sidestore://source?url=$SOURCE_URL"
            echo "- Feather: feather://source/$SOURCE_URL"
            echo "- LiveContainer: livecontainer://sources?url=$SOURCE_URL"
            echo "- StikStore: stikstore://add-source?url=$SOURCE_URL"
            echo "- TrollApps: trollapps://add?url=$SOURCE_URL"
            echo "- FlareStore: flarestore://source?url=$SOURCE_URL"
            echo "- ESign: esign://addsource?url=$SOURCE_URL"
            echo "- Ksign: ksign://addsource?url=$SOURCE_URL"
            echo "- GBox: gbox://AddSource/$SOURCE_URL"
            echo "- KravaSigner: kravasigner://addRepo=$SOURCE_URL"
            echo
            echo "### Install this release"
            if [ -n "$IPA" ]; then
              echo "- Direct IPA: $IPA"
              echo "- AltStore: altstore://install?url=$IPA"
              echo "- SideStore: sidestore://install?url=$IPA"
              echo "- Feather: feather://install/$IPA"
              echo "- ESign: esign://install?url=$IPA"
              echo "- Ksign: ksign://install?url=$IPA"
            else
              echo "- No IPA asset URL was returned by GitHub."
            fi
            echo
            echo "### IPA assets"
            if [ -n "$ASSETS" ]; then echo "$ASSETS" | while IFS= read -r url; do echo "- $url"; done; fi
          } > release-notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md