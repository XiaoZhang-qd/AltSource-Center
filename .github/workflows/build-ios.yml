name: Build iOS IPAs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
        default: "0.1.0"
      deployment_target:
        description: Requested minimum iOS version
        required: true
        type: string
        default: "13.0"
      release_notes:
        description: Manual release notes
        required: false
        type: string
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos-sdks
          fetch-depth: 1
      - name: Build every usable iPhoneOS SDK
        env:
          THEOS_SDKS: ${{ github.workspace }}/theos-sdks
          REQUESTED_TARGET: ${{ inputs.deployment_target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/all build/skipped
          found=0; built=0; shopt -s nullglob
          for sdk in "$THEOS_SDKS"/iPhoneOS*.sdk; do
            found=1; version="$(basename "$sdk" .sdk | sed 's/^iPhoneOS//')"
            uikit="$sdk/System/Library/Frameworks/UIKit.framework/UIKit.tbd"
            if [ -f "$uikit" ] && grep -q 'ios-simulator' "$uikit"; then echo "Skipping iPhoneOS$version.sdk"; echo "iPhoneOS$version.sdk: simulator UIKit.tbd" >> build/skipped/sdk.txt; continue; fi
            effective_target="$(python3 - "$REQUESTED_TARGET" "$version" <<'PY'
import sys
from decimal import Decimal
print(f"{min(Decimal(sys.argv[1]),Decimal(sys.argv[2])):.1f}")
PY
)"
            bash ./build/local/build-ios.sh --sdk "$version" --target "$effective_target" --arch arm64
            ipa=(build/out/*.ipa); [ "${#ipa[@]}" -eq 1 ] || exit 1
            cp "${ipa[0]}" "build/all/AltSourceCenter-iOS-$version-arm64.ipa"
            built=$((built+1))
          done
          [ "$found" -eq 1 ] && [ "$built" -gt 0 ]
      - name: Publish IPAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" build/all/*.ipa --title "AltSource Center v${{ inputs.version }}" --notes "${{ inputs.release_notes }}"