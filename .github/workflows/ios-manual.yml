name: Build iOS IPAs (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: "0.1.0"
      deployment_target:
        description: Minimum iOS version
        required: true
        default: "13.0"
      release_notes:
        description: Release notes
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Theos SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos-sdks
          fetch-depth: 1

      - name: Build iOS IPA
        env:
          THEOS_SDKS: ${{ github.workspace }}/theos-sdks
          REQUESTED_TARGET: ${{ inputs.deployment_target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/all
          found=0
          built=0
          shopt -s nullglob

          for sdk in "$THEOS_SDKS"/iPhoneOS*.sdk; do
            found=1
            version="$(basename "$sdk" .sdk | sed 's/^iPhoneOS//')"
            uikit="$sdk/System/Library/Frameworks/UIKit.framework/UIKit.tbd"

            if [ -f "$uikit" ] && grep -q 'ios-simulator' "$uikit"; then
              echo "Skipping simulator SDK: iPhoneOS$version.sdk"
              continue
            fi

            effective_target="$(python3 - "$REQUESTED_TARGET" "$version" <<'PY'
import sys
from decimal import Decimal
requested = Decimal(sys.argv[1])
sdk = Decimal(sys.argv[2])
print(f"{min(requested, sdk):.1f}")
PY
)"

            bash ./build/local/build-ios.sh               --sdk "$version"               --target "$effective_target"               --arch arm64

            ipa=(build/out/*.ipa)
            if [ "${#ipa[@]}" -ne 1 ]; then
              echo "Expected exactly one IPA for iPhoneOS$version.sdk"
              exit 1
            fi

            cp "${ipa[0]}" "build/all/AltSourceCenter-iOS-$version-arm64.ipa"
            built=$((built + 1))
          done

          if [ "$found" -eq 0 ]; then
            echo "No iPhoneOS SDKs were found."
            exit 1
          fi

          if [ "$built" -eq 0 ]; then
            echo "No usable iPhoneOS SDKs were found."
            exit 1
          fi

          ls -lh build/all

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}"             build/all/*.ipa             --title "AltSource Center v${{ inputs.version }}"             --notes "${{ inputs.release_notes }}"
