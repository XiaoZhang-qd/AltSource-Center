name: Build iOS IPAs

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "2.0.0"
        type: string
      deployment_target:
        description: "Minimum iOS version"
        required: true
        default: "13.0"
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build all iPhoneOS SDKs
    runs-on: macos-14
    steps:
      - name: Checkout AltSource Center
        uses: actions/checkout@v4

      - name: Checkout Theos SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos-sdks
          fetch-depth: 1

      - name: Show SDKs
        shell: bash
        run: |
          set -euxo pipefail
          echo "THEOS_SDKS=$GITHUB_WORKSPACE/theos-sdks"
          find "$GITHUB_WORKSPACE/theos-sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print | sort -V

      - name: Build every iPhoneOS SDK
        shell: bash
        env:
          THEOS_SDKS: ${{ github.workspace }}/theos-sdks
          REQUESTED_TARGET: ${{ inputs.deployment_target }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          rm -rf build/all
          mkdir -p build/all

          found=0
          built=0

          while IFS= read -r sdk; do
            version="$(basename "$sdk" .sdk | sed 's/^iPhoneOS//')"
            # Modern Apple clang on macOS 14 cannot link the legacy iPhoneOS 9.x–12.x
            # SDKs shipped in theos/sdks. Only use SDKs that can produce device binaries.
            if [ "$(printf '%s\n' "$version" "13.0" | sort -V | head -1)" != "13.0" ]; then
              echo "Skipping legacy iPhoneOS$version.sdk (not linkable on this runner)"
              continue
            fi
            found=1
            echo "=== Building iPhoneOS $version ==="

            bash ./build/local/build-ios.sh \
              --sdk "$version" \
              --target "$REQUESTED_TARGET" \
              --version "$RELEASE_VERSION" \
              --arch arm64

            ipa=(build/out/*.ipa)
            if [ "${#ipa[@]}" -ne 1 ]; then
              echo "Expected exactly one IPA, found ${#ipa[@]}" >&2
              exit 1
            fi

            cp "${ipa[0]}" "build/all/AltSourceCenter-iOS-${version}-arm64.ipa"
            built=$((built + 1))
          done < <(find "$THEOS_SDKS" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print | sort -V)

          if [ "$found" -eq 0 ]; then
            echo "No iPhoneOS SDKs found in $THEOS_SDKS" >&2
            exit 1
          fi

          if [ "$built" -eq 0 ]; then
            echo "No IPA was built." >&2
            exit 1
          fi

          ls -lh build/all

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading/replacing IPA assets."
            gh release upload "$tag" build/all/*.ipa --clobber
            if [ -n "$RELEASE_NOTES" ]; then
              gh release edit "$tag" --notes "$RELEASE_NOTES"
            fi
          else
            gh release create "$tag" \
              build/all/*.ipa \
              --title "AltSource Center $tag" \
              --notes "$RELEASE_NOTES"
          fi
