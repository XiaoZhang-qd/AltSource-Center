name: Build iOS IPAs (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: "2.0.0"
      deployment_target:
        description: Minimum iOS version
        required: true
        default: "13.0"
      release_notes:
        description: Release notes
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Theos SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos-sdks
          fetch-depth: 1
      - name: Build every device SDK
        env:
          THEOS_SDKS: \${{ github.workspace }}/theos-sdks
          REQUESTED_TARGET: \${{ inputs.deployment_target }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/all
          mkdir -p build/all
          found=0
          built=0
          shopt -s nullglob
          for sdk in "$THEOS_SDKS"/iPhoneOS*.sdk; do
            found=1
            version="$(basename "$sdk" .sdk | sed 's/^iPhoneOS//')"
            bash ./build/local/build-ios.sh --sdk "$version" --target "$REQUESTED_TARGET" --arch arm64
            ipa=(build/out/*.ipa)
            test "\${#ipa[@]}" -eq 1
            cp "\${ipa[0]}" "build/all/AltSourceCenter-iOS-$version-arm64.ipa"
            built=$((built+1))
          done
          test "$found" -eq 1
          test "$built" -gt 0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release create "v\${{ inputs.version }}" build/all/*.ipa --title "AltSource Center v\${{ inputs.version }}" --notes "\${{ inputs.release_notes }}"